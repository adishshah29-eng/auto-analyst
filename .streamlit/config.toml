# Streamlit Community Cloud's free tier gives the whole app ~1GB RAM
# shared between Streamlit itself and the sandboxed child process. Cap
# upload size so one large file can't blow that budget before the agent
# even starts. Peak in-memory footprint per upload is roughly 5-10x the
# CSV size (pandas' object-column overhead + the pickle copy that gets
# sent into the sandboxed child + its unpickled copy), so 50MB caps peak
# usage around 250-500MB — comfortable on the free tier, with headroom.
# Streamlit's own default is 200MB; safe to raise this on a paid tier or
# self-hosted deploy where the ~1GB container cap doesn't apply.
[server]
maxUploadSize = 50
